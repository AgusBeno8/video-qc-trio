name: Cross-Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test Environment (${{ matrix.os }} / Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install av boto3

      - name: Verify PyAV C-Bindings
        run: |
          python -c "import av; print('PyAV C-bindings linked successfully on', '${{ matrix.os }}')"

      - name: Verify boto3
        run: |
          python -c "import boto3; print('boto3 linked successfully on', '${{ matrix.os }}')"
